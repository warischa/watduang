name: ci

on:
  push:
  pull_request:

# CSP note: no report-uri/report-to directive is set in staticwebapp.config.json —
# there is no collector endpoint yet. Add CSP reporting once one exists.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check Node major version (>=22 required for type-stripping in validate-games.mjs)
        run: |
          node -v
          major=$(node -p "process.versions.node.split('.')[0]")
          if [ "$major" -lt 22 ]; then
            echo "::error::Node major version $major < 22 — scripts/validate-games.mjs needs built-in .ts type stripping (Node >=22.18)."
            exit 1
          fi

      - name: npm ci
        run: npm ci

      - name: Validate games
        run: node scripts/validate-games.mjs

      # --selftest first: proves findCitations still matches something before trusting the
      # live scan's "all clear" — a regex regression that matches nothing would otherwise
      # leave this guard permanently green.
      - name: Check doc citations
        run: node scripts/check-citations.mjs --selftest && node scripts/check-citations.mjs

      # --selftest first, same reason as above: proves the comment/string split still works before
      # trusting a 0 count. "Write English. Ship Thai." (#36) — a Thai comment line, or a line where
      # a comment and a string both carry Thai (ambiguous, unresolved), fails the build; a skipped
      # file (no analyzer, e.g. .sh) only warns.
      - name: Check Thai code comments
        run: node scripts/thai-comments.mjs --selftest && node scripts/thai-comments.mjs

      # Cheap source-text tripwire for ADR-0014 (no navigation target inside #stage) — catches an
      # anchor literal reintroduced into a game module before the heavier build+serve+Chrome probe
      # (scripts/no-nav-in-stage-probe.mjs) ever runs. --selftest first, same reason as above.
      - name: No nav target inside stage (static check)
        run: node scripts/no-nav-in-stage-check.mjs --selftest && node scripts/no-nav-in-stage-check.mjs

      # Four more source-text tripwires, same bargain as the one above: each stands in for a browser
      # probe that backs a shipped invariant but runs nowhere (gh#43) — ADR-0015, ADR-0016/0017, #39,
      # ADR-0010 in order. None of them replaces its probe; each names in its own ponytail: header
      # what it provably cannot see. They sit before Build for the same structural reason astro check
      # does below: a step that runs before dist/ exists cannot invalidate the artifact every gate
      # after Build reads. --selftest first, same reason as above.
      - name: Leave-confirm stays inert while closed (static check)
        run: node scripts/leave-confirm-check.mjs --selftest && node scripts/leave-confirm-check.mjs

      - name: Every render function gates its buttons (static check)
        run: node scripts/arm-gate-coverage-check.mjs --selftest && node scripts/arm-gate-coverage-check.mjs

      - name: Stable-exit marker set stays closed (static check)
        run: node scripts/stable-exit-markers-check.mjs --selftest && node scripts/stable-exit-markers-check.mjs

      - name: Roster lock structure and key ownership (static check)
        run: node scripts/roster-lock-structure-check.mjs --selftest && node scripts/roster-lock-structure-check.mjs

      # ADR-0010 keeps ONE site-wide checkpoint slot, and the owner settled that on 2026-08-19 —
      # gh#24 closed, the alternative declined rather than deferred. This gate fires the moment a
      # second src/games/*.ts file writes a checkpoint, and says to reopen gh#24, not to build.
      - name: Only one game writes a checkpoint (ADR-0010 trigger)
        run: node scripts/checkpoint-writer-check.mjs --selftest && node scripts/checkpoint-writer-check.mjs

      # node --test <dir> doesn't work on node 22 (it treats dir as a module path) — must use a glob.
      # A glob that matches NOTHING is not an error: node prints "# tests 0" and exits 0. So a rename
      # (.test.mjs -> .test.ts) or a move out of src/ would leave this step green with every test
      # silently not running — measured, gh#45. The pass count is therefore asserted non-zero:
      # an inverted guard must count, not just exclude (ADR-0019).
      # PIPESTATUS, not $? — after a pipe, $? is tee's status and is always 0 (agent CI-verification doc).
      - name: Unit tests
        run: |
          node --test 'src/**/*.test.mjs' 2>&1 | tee /tmp/unit-tests.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1
          grep -qE '^# pass [1-9]' /tmp/unit-tests.txt \
            || { echo 'Unit tests: 0 tests ran — the glob matched nothing (gh#45)'; exit 1; }

      # astro check writes .astro/ type files, never dist/ — running it here, before Build,
      # makes it structurally impossible for this verification step to invalidate the dist/
      # artifact that every gate below reads. gh#38.
      - name: Astro check
        run: npx astro check

      # npm run build, not npx astro build — the prebuild in package.json must actually run,
      # otherwise the gate that blocks games with no OG image only fires when invoked the other way.
      - name: Build
        run: npm run build

      # CSP checked against dist/staticwebapp.config.json (the deployed artifact), not the
      # repo-root source — Azure SWA only reads config from inside app_location. This also
      # guards the defect where the file silently fails to ship.
      # AdSense's activation snippet is inline JS; script-src has no 'unsafe-inline' by design
      # (our own bundles are external _astro/*.js under 'self'), so when the ad tag is
      # integrated it must live in an external self-hosted script file, not inline.
      # The old version of this step was directive-BLIND: it substring-matched the whole header, so
      # moving *.googlesyndication.com from script-src into img-src kept it green while the AdSense
      # loader was blocked (gh#47, ADR-0019 rule 1). The script asserts (directive, source) pairs.
      # --selftest first, same reason as the gates above — and both CSP selftests are hermetic
      # (temp-dir fixtures and strings only, never dist/), so unlike crawl-check's below they cannot
      # invalidate the artifact this step and every step after it reads. gh#38.
      - name: CSP allowlist check (dist artifact)
        run: node scripts/csp-allowlist-check.mjs --selftest && node scripts/csp-allowlist-check.mjs

      # Inline execution in built HTML, two shapes: an inlined <script> element (Astro inlines a page
      # script with no imports under assetsInlineLimit) and an inline-execution ATTRIBUTE — on*=,
      # javascript: in href/src/formaction, srcdoc=. The attribute half is new: script-src does not
      # govern it at all (script-src-attr / 'unsafe-hashes' does), so it is blocked just as hard and
      # nothing here looked for it (gh#47). Matched as syntactic classes, not member lists.
      # HTML comments are blanked before matching — ADR-0019 rule 2, negative-presence direction.
      # --selftest first, and hermetic: temp fixtures only, dist/ is never rebuilt. gh#38.
      # ⚠ The step NAME is load-bearing: docs/post-launch-checklist.md quotes it verbatim to tell the
      # site owner which gate rejects AdSense's inline activation snippet. Renaming it kills that
      # citation silently — check-citations.mjs only resolves .md targets, so no gate would catch it.
      - name: CSP inline-script gate (dist artifact)
        run: node scripts/csp-inline-check.mjs --selftest && node scripts/csp-inline-check.mjs

      - name: Sitemap covers tool pages
        # Checks all four, not just wheel. The single-page version of this gate stayed green on a
        # sitemap with /tool/draw/ deleted — verified by doctoring dist/sitemap-0.xml, 2026-08-14.
        # SEO is this site's business model, so a tool page silently leaving the sitemap is not cosmetic.
        run: |
          missing=''
          for tool in wheel draw team number; do
            grep -q "/tool/$tool/" dist/sitemap-0.xml || missing="$missing /tool/$tool/"
          done
          if [ -n "$missing" ]; then
            echo "::error::dist/sitemap-0.xml missing:$missing — tool pages must be discoverable"
            exit 1
          fi

      # gh#39 — proves GameNav still renders a crawlable /game/*/ link to every OTHER game on every
      # built game page, and never a self-link. Reads dist/game/*/index.html directly, so it belongs
      # with the other dist-artifact checks above and doesn't need the smoke test's live server below.
      # --selftest is deliberately NOT run here. It mutates tracked source and rebuilds dist/ four
      # times, so the artifact the CSP and sitemap gates above checked would no longer be the one the
      # Smoke test and Deploy below use. Prove the detector by hand instead:
      #   node scripts/crawl-check-gamenav.mjs --selftest
      - name: crawl-check GameNav (dist artifact)
        run: node scripts/crawl-check-gamenav.mjs

      - name: Smoke test (portability — dist/ must serve standalone, no Azure runtime)
        run: |
          npx serve@14 dist/ -l 4321 &
          SERVER_PID=$!
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Server did not become ready within timeout"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          status=0
          # Every built game must be smoke-tested, not just the ones whose names we remembered when writing this file —
          # the old list hardcoded /game/timebomb/, so game #2 onward never got hit at all.
          GAME_PATHS=$(for d in dist/game/*/; do [ -d "$d" ] || continue; echo "/game/$(basename "$d")/"; done)
          # Compares the number of pages built against the number of games in the manifest — "more than zero"
          # alone can still stay green while one game is missing (manifest reverted but the game file still
          # exists → validate passes, smoke passes, prod 404s).
          BUILT=$(printf '%s\n' "$GAME_PATHS" | grep -c . || true)
          EXPECTED=$(node --input-type=module -e "const {games} = await import('./src/games/manifest.ts'); console.log(games.length)")
          if [ "$BUILT" -ne "$EXPECTED" ]; then
            echo "::error::Built $BUILT game page(s) but manifest declares $EXPECTED"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          # Compares dist/tool/*/ against the slug list declared right here (not derived from src/pages/tool/ —
          # src is the source that generates it; if a tool page disappears, src disappears with it, so baseline
          # and output would shrink together and pass silently).
          EXPECTED_TOOL_SLUGS="wheel draw team number"
          TOOL_PATHS=$(for d in dist/tool/*/; do [ -d "$d" ] || continue; echo "/tool/$(basename "$d")/"; done)
          for slug in $EXPECTED_TOOL_SLUGS; do
            if [ ! -d "dist/tool/$slug" ]; then
              echo "::error::Expected tool page 'dist/tool/${slug}/' not found in build output"
              kill "$SERVER_PID" 2>/dev/null || true
              exit 1
            fi
          done
          echo "smoke: $BUILT game page(s) (matches manifest) + tool page(s) ($EXPECTED_TOOL_SLUGS) + core pages"
          for path in "/" "/games/" "/tools/" $GAME_PATHS $TOOL_PATHS; do
            body=$(curl -sf "http://localhost:4321${path}") || { echo "::error::curl failed for ${path}"; status=1; continue; }
            if ! echo "$body" | grep -qi '<title>'; then
              echo "::error::No <title> tag found for ${path}"
              status=1
            fi
            # og:image must exist and must actually load — a meta tag pointing at a file that isn't there
            # is a blank link when shared, which fails completely silently with nothing visibly broken on the site.
            og=$(echo "$body" | grep -o 'property="og:image" content="[^"]*"' | head -1 | sed 's/.*content="//; s/"$//')
            if [ -z "$og" ]; then
              echo "::error::No og:image for ${path}"
              status=1
            else
              # https* not https\? — \? is a GNU extension that doesn't test on mac; this one is pure POSIX
              og_path=$(echo "$og" | sed 's|^https*://[^/]*||')
              if ! curl -sf -o /dev/null "http://localhost:4321${og_path}"; then
                echo "::error::og:image does not resolve for ${path} -> ${og}"
                status=1
              fi
            fi
          done

          kill "$SERVER_PID" 2>/dev/null || true
          exit $status

      - name: Deploy to Azure Static Web Apps
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DEPLOY_TOKEN == 'true' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          skip_app_build: true

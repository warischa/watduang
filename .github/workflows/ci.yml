name: ci

on:
  push:
  pull_request:

# CSP note: no report-uri/report-to directive is set in staticwebapp.config.json —
# there is no collector endpoint yet. Add CSP reporting once one exists.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check Node major version (>=22 required for type-stripping in validate-games.mjs)
        run: |
          node -v
          major=$(node -p "process.versions.node.split('.')[0]")
          if [ "$major" -lt 22 ]; then
            echo "::error::Node major version $major < 22 — scripts/validate-games.mjs needs built-in .ts type stripping (Node >=22.18)."
            exit 1
          fi

      - name: npm ci
        run: npm ci

      - name: Validate games
        run: node scripts/validate-games.mjs

      # node --test <dir> ไม่ทำงานบน node 22 (มันตีความ dir เป็น module path) ต้องใช้ glob
      - name: Unit tests
        run: node --test 'src/**/*.test.mjs'

      # npm run build ไม่ใช่ npx astro build — prebuild ใน package.json ต้องได้ทำงาน
      # ไม่งั้น gate ที่กันเกมไม่มีรูป OG มีผลแค่ตอนเรียกอีกสะกดหนึ่งเท่านั้น
      - name: Build
        run: npm run build

      # CSP checked against dist/staticwebapp.config.json (the deployed artifact), not the
      # repo-root source — Azure SWA only reads config from inside app_location. This also
      # guards the defect where the file silently fails to ship.
      # AdSense's activation snippet is inline JS; script-src has no 'unsafe-inline' by design
      # (our own bundles are external _astro/*.js under 'self'), so when the ad tag is
      # integrated it must live in an external self-hosted script file, not inline.
      - name: CSP allowlist check (dist artifact)
        run: |
          node -e "
            const cfg = JSON.parse(require('fs').readFileSync('dist/staticwebapp.config.json', 'utf8'));
            const csp = cfg.globalHeaders && cfg.globalHeaders['Content-Security-Policy'];
            if (!csp) { console.error('No Content-Security-Policy in globalHeaders'); process.exit(1); }
            const required = [
              '*.googlesyndication.com',
              '*.doubleclick.net',
              '*.google.com',
              '*.adtrafficquality.google',
              'style-src',
            ];
            const missing = required.filter((src) => !csp.includes(src));
            if (missing.length) {
              console.error('CSP missing required Google source expression(s): ' + missing.join(', '));
              process.exit(1);
            }
            console.log('CSP allowlist check ok');
          "

      # Astro inlines a page script when it has no imports and is under assetsInlineLimit —
      # CSP script-src has no 'unsafe-inline', so an inlined script is silently blocked in prod.
      # จับ <script> ที่ไม่มี src ทุกแบบ ไม่ใช่แค่สะกด type="module": <script is:inline> ที่เขียนมือ
      # ออกมาเป็น <script> เปล่า โดน CSP บล็อกเหมือนกันแต่ grep สะกดเดียวมองไม่เห็น
      # allowlist ของชนิดที่ CSP คุม ไม่ใช่ blocklist ของ ld+json — data block จริง (ld+json, json)
      # CSP ไม่บล็อก จึงต้องไม่เป็น false positive ที่ทำให้มีคนมาถอด gate ทิ้ง
      # ⚠ importmap และ speculationrules **ไม่ใช่** data block ที่ปลอดภัย — script-src-elem คุมทั้งคู่
      # (spec เพิ่มคีย์เวิร์ด 'inline-speculation-rules' มาเพราะเหตุนี้ · Chrome ปฏิเสธ inline import map
      # ภายใต้ CSP เข้ม) ถ้าไม่จับ วันหนึ่งมีคนใส่ import map แล้ว module ทั้งหน้าหยุดโหลดโดย gate เขียว
      - name: CSP inline-script gate (dist artifact)
        run: |
          node - <<'NODE'
          const { readdirSync, readFileSync } = require('fs');
          const { join } = require('path');
          const JS_TYPES = new Set([
            '', 'module', 'text/javascript', 'application/javascript',
            'text/ecmascript', 'application/ecmascript', 'text/jscript', 'application/x-javascript',
            // MIME เก่าที่เบราว์เซอร์ยังรันเป็น JS — CSP บล็อกเหมือนกัน
            'text/x-javascript', 'text/x-ecmascript', 'application/x-ecmascript', 'text/livescript',
            'text/javascript1.0', 'text/javascript1.1', 'text/javascript1.2',
            'text/javascript1.3', 'text/javascript1.4', 'text/javascript1.5',
            // ไม่ใช่ JS แต่ script-src-elem คุม — inline แล้วโดนบล็อกเงียบเหมือนกัน
            'importmap', 'speculationrules',
          ]);
          const files = [];
          (function walk(dir) {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const full = join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.html')) files.push(full);
            }
          })('dist');
          let bad = false;
          for (const file of files) {
            for (const tag of readFileSync(file, 'utf8').match(/<script\b[^>]*>/gi) || []) {
              if (/[\s"']src\s*=/i.test(tag)) continue; // ขอบเขตหน้า src กัน data-src ถูกนับเป็น src ของจริง
              const attr = tag.match(/[\s"']type\s*=\s*("([^"]*)"|'([^']*)'|([^\s>]+))/i);
              const type = (attr ? attr[2] ?? attr[3] ?? attr[4] : '').trim().toLowerCase();
              if (!JS_TYPES.has(type)) continue;
              console.log('::error file=' + file + '::' + file + ' has an inline script with no src: ' + tag +
                " — CSP script-src 'self' has no 'unsafe-inline', so this script is blocked and the page silently does nothing in production");
              bad = true;
            }
          }
          if (bad) process.exit(1);
          console.log('CSP inline-script gate ok — ' + files.length + ' HTML file(s), every <script> has src or is a non-JS data block');
          NODE

      - name: Sitemap covers tool pages
        run: |
          if ! grep -q '/tool/wheel/' dist/sitemap-0.xml; then
            echo "::error::dist/sitemap-0.xml missing /tool/wheel/ — tool pages must be discoverable"
            exit 1
          fi

      - name: Smoke test (portability — dist/ must serve standalone, no Azure runtime)
        run: |
          npx serve@14 dist/ -l 4321 &
          SERVER_PID=$!
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Server did not become ready within timeout"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          status=0
          # ทุกเกมที่ build ออกมาต้องถูก smoke ไม่ใช่แค่เกมที่จำชื่อได้ตอนเขียนไฟล์นี้ —
          # ลิสต์เดิม hardcode /game/timebomb/ ไว้ เกมที่ 2 เป็นต้นไปจึงไม่เคยถูกยิงเลย
          GAME_PATHS=$(for d in dist/game/*/; do [ -d "$d" ] || continue; echo "/game/$(basename "$d")/"; done)
          # เทียบจำนวนหน้าที่ build ได้กับจำนวนเกมใน manifest — แค่ "มีมากกว่าศูนย์" ยัง green ได้
          # ทั้งที่เกมหนึ่งหายไป (manifest ถูก revert แต่ไฟล์เกมยังอยู่ → validate ผ่าน, smoke ผ่าน, prod 404)
          BUILT=$(printf '%s\n' "$GAME_PATHS" | grep -c . || true)
          EXPECTED=$(node --input-type=module -e "const {games} = await import('./src/games/manifest.ts'); console.log(games.length)")
          if [ "$BUILT" -ne "$EXPECTED" ]; then
            echo "::error::Built $BUILT game page(s) but manifest declares $EXPECTED"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          # เทียบ dist/tool/*/ กับลิสต์ slug ที่ประกาศไว้ตรงนี้ (ไม่ใช่ derive จาก src/pages/tool/ —
          # src เป็นตัวสร้าง ถ้าหน้าเครื่องมือหายไป src ก็หายไปด้วย baseline กับ output จะหดพร้อมกันแล้วผ่านเงียบๆ)
          EXPECTED_TOOL_SLUGS="wheel"
          TOOL_PATHS=$(for d in dist/tool/*/; do [ -d "$d" ] || continue; echo "/tool/$(basename "$d")/"; done)
          for slug in $EXPECTED_TOOL_SLUGS; do
            if [ ! -d "dist/tool/$slug" ]; then
              echo "::error::Expected tool page 'dist/tool/${slug}/' not found in build output"
              kill "$SERVER_PID" 2>/dev/null || true
              exit 1
            fi
          done
          echo "smoke: $BUILT game page(s) (matches manifest) + tool page(s) ($EXPECTED_TOOL_SLUGS) + core pages"
          for path in "/" "/games/" "/tools/" $GAME_PATHS $TOOL_PATHS; do
            body=$(curl -sf "http://localhost:4321${path}") || { echo "::error::curl failed for ${path}"; status=1; continue; }
            if ! echo "$body" | grep -qi '<title>'; then
              echo "::error::No <title> tag found for ${path}"
              status=1
            fi
            # og:image ต้องมีและต้องโหลดได้จริง — meta ที่ชี้ไปไฟล์ที่ไม่มีคือลิงก์เปล่าตอนแชร์
            # ซึ่งพังเงียบสนิท ไม่มีอะไรในเว็บแตกให้เห็น
            og=$(echo "$body" | grep -o 'property="og:image" content="[^"]*"' | head -1 | sed 's/.*content="//; s/"$//')
            if [ -z "$og" ]; then
              echo "::error::No og:image for ${path}"
              status=1
            else
              # https* ไม่ใช่ https\? — \? เป็นส่วนขยาย GNU ที่ทดสอบบน mac ไม่ได้ ตัวนี้ POSIX ล้วน
              og_path=$(echo "$og" | sed 's|^https*://[^/]*||')
              if ! curl -sf -o /dev/null "http://localhost:4321${og_path}"; then
                echo "::error::og:image does not resolve for ${path} -> ${og}"
                status=1
              fi
            fi
          done

          kill "$SERVER_PID" 2>/dev/null || true
          exit $status

      - name: Deploy to Azure Static Web Apps
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DEPLOY_TOKEN == 'true' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          skip_app_build: true

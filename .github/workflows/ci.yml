name: ci

on:
  push:
  pull_request:

# CSP note: no report-uri/report-to directive is set in staticwebapp.config.json —
# there is no collector endpoint yet. Add CSP reporting once one exists.

jobs:
  build:
    runs-on: ubuntu-latest
    # A permissions: block is exhaustive — declaring it at all drops everything not listed to none,
    # so contents: read must be spelled out here or actions/checkout@v5 below gets a token that
    # cannot read this repo. id-token: write is what lets azure/login mint the OIDC assertion;
    # without it that step fails with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
    # Nothing beyond these two is needed. The deploy action's own action.yml documents repo_token as
    # "Currently used only for commenting on Pull Requests", and the deploy steps are gated to
    # push + refs/heads/main, so that path never runs here -- no deployments: write, no
    # pull-requests: write. Checked against the action contract rather than guessed, because an
    # exhaustive permissions block that is one entry short would fail on the first ARMED push,
    # which is the owner's go-live and the worst possible moment to discover it.
    permissions:
      contents: read
      id-token: write
    env:
      # Armed only when ALL THREE identifiers exist. A partial set must read as NOT armed: two of
      # three would sail past this gate and die inside azure/login after every other gate has
      # gone green, so an unconfigured repo would look like a broken deploy instead of a quiet one.
      # Stored as repository SECRETS rather than variables deliberately, even though client/tenant/
      # subscription ids are identifiers and not credentials: several docs here answer "is deploy
      # armed?" by reading actions/secrets total_count, and splitting the signal across secrets and
      # variables would let an agent report "not armed" on a repo that is armed.
      HAS_DEPLOY_IDENTITY: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
    steps:
      # fetch-depth: 0, not the default shallow clone. The "No new line-number citations" gate below
      # diffs this push against its own base (github.event.before, or the PR base sha), and neither
      # rev exists in a depth-1 checkout — the gate would fail closed on every run. Nothing else here
      # needs history; this repo is small enough that a full clone costs seconds.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check Node major version (>=22 required for type-stripping in validate-games.mjs)
        run: |
          node -v
          major=$(node -p "process.versions.node.split('.')[0]")
          if [ "$major" -lt 22 ]; then
            echo "::error::Node major version $major < 22 — scripts/validate-games.mjs needs built-in .ts type stripping (Node >=22.18)."
            exit 1
          fi

      - name: npm ci
        run: npm ci

      # FIRST gate on purpose, and cheap: a static read of package.json plus this file. It answers
      # "can any gate below this line even fail?" — including "is every gate wired into BOTH
      # executors", since this workflow never runs `npm run ci` and a gate chained only into that
      # aggregate would execute nowhere here. Catching that after Build, the browser probes and
      # twenty minutes of runner time would mean burning the whole run to learn none of it counted.
      - name: No gate can ship unable to fail (meta-check, both executors)
        run: node scripts/gate-selftest-coverage-check.mjs --selftest && node scripts/gate-selftest-coverage-check.mjs

      # --selftest first, same reason as the guards below: the live scan over six known-good
      # manifest entries is green whether or not the rules still fire. The selftest drives 21
      # known-bad fixtures through the same validateGames() and fails if any rule stops
      # reporting, so a neutered rule cannot ride a green "6 game(s) OK" into a deploy.
      - name: Validate games
        run: node scripts/validate-games.mjs --selftest && node scripts/validate-games.mjs

      # --selftest first: proves findCitations still matches something before trusting the
      # live scan's "all clear" — a regex regression that matches nothing would otherwise
      # leave this guard permanently green.
      - name: Check doc citations
        run: node scripts/check-citations.mjs --selftest && node scripts/check-citations.mjs

      # The other half of the citation problem: check-citations.mjs above resolves .md targets only
      # (its lineNoRe requires a .md extension), so a citation naming a SOURCE line by number has
      # never been checked by anything — S2026-08-21 left an ADR and a unit test pointing at the
      # wrong code that way. This gate bans the form on lines a push ADDS. Diff-scoped on purpose:
      # 182 such citations already exist, two of them frozen records that cannot be re-anchored
      # without falsifying what they record, so a tree-wide ban would need a grandfather list that
      # decays into noise. The script's header carries the measurement and the reasoning.
      # Base rev order: PR base sha > github.event.before > merge-base with origin/main. That last
      # fallback exists because `on: push` is unfiltered and before-SHA is all-zeros on a branch's
      # first push and on any tag push — this repo calibrates CI on throwaway branches deliberately,
      # so those must not red. When none of the three resolves it FAILS CLOSED rather than diffing an
      # empty range and printing a green zero, and an empty range is labelled as proving nothing
      # instead of reading as a pass. See the fetch-depth: 0 note on checkout above.
      # --selftest first, same reason as the gates around it.
      - name: No new line-number citations into source (added lines only)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/added-lineno-citation-check.mjs --selftest && node scripts/added-lineno-citation-check.mjs

      # --selftest first, same reason as above: proves the comment/string split still works before
      # trusting a 0 count. "Write English. Ship Thai." (#36) — a Thai comment line, or a line where
      # a comment and a string both carry Thai (ambiguous, unresolved), fails the build; a skipped
      # file (no analyzer, e.g. .sh) only warns.
      - name: Check Thai code comments
        run: node scripts/thai-comments.mjs --selftest && node scripts/thai-comments.mjs

      # gh#84 — public/ is copied verbatim into dist/, so a file left there ships to the live site
      # whether or not anything points at it. This gate refuses an unreferenced binary and a raster
      # over its declared ceiling. It reads public/ and src/, never dist/, so it runs here with the
      # other source-text gates rather than after the build. --selftest first, same reason as above.
      - name: No orphan or oversized binary under public/
        run: node scripts/public-orphan-check.mjs --selftest && node scripts/public-orphan-check.mjs

      # Cheap source-text tripwire for ADR-0014 (no navigation target inside #stage) — catches an
      # anchor literal reintroduced into a game module before the heavier build+serve+Chrome probe
      # (scripts/no-nav-in-stage-probe.mjs) ever runs. --selftest first, same reason as above.
      - name: No nav target inside stage (static check)
        run: node scripts/no-nav-in-stage-check.mjs --selftest && node scripts/no-nav-in-stage-check.mjs

      # Four more source-text tripwires, same bargain as the one above: each stands in for a browser
      # probe that backs a shipped invariant but runs nowhere (gh#43) — ADR-0015, ADR-0016/0017, #39,
      # ADR-0010 in order. None of them replaces its probe; each names in its own ponytail: header
      # what it provably cannot see. They sit before Build for the same structural reason astro check
      # does below: a step that runs before dist/ exists cannot invalidate the artifact every gate
      # after Build reads. --selftest first, same reason as above.
      - name: Leave-confirm stays inert while closed (static check)
        run: node scripts/leave-confirm-check.mjs --selftest && node scripts/leave-confirm-check.mjs

      # gh#121 — the leave-confirm above is only as good as the signal that arms it. GameModule now
      # requires startsRound, so a new module cannot silently skip the question (astro check reds on
      # a missing field); this gate enforces the consequence of the answer, including the bypass leg
      # that forbids spelling the event as a literal. --selftest first, same reason as above.
      - name: A module that starts a round announces it (gh#121)
        run: node scripts/round-start-announce-check.mjs --selftest && node scripts/round-start-announce-check.mjs

      - name: Every render function gates its buttons (static check)
        run: node scripts/arm-gate-coverage-check.mjs --selftest && node scripts/arm-gate-coverage-check.mjs

      - name: Stable-exit marker set stays closed (static check)
        run: node scripts/stable-exit-markers-check.mjs --selftest && node scripts/stable-exit-markers-check.mjs

      - name: Roster lock structure and key ownership (static check)
        run: node scripts/roster-lock-structure-check.mjs --selftest && node scripts/roster-lock-structure-check.mjs

      # ADR-0010 keeps ONE site-wide checkpoint slot, and the owner settled that on 2026-08-19 —
      # gh#24 closed, the alternative declined rather than deferred. This gate fires the moment a
      # second src/games/*.ts file writes a checkpoint, and says to reopen gh#24, not to build.
      - name: Only one game writes a checkpoint (ADR-0010 trigger)
        run: node scripts/checkpoint-writer-check.mjs --selftest && node scripts/checkpoint-writer-check.mjs

      # gh#77 box7 — JS-driven motion (rAF, or a per-frame `.style.*` write) is invisible to a
      # CSS-only prefers-reduced-motion check, so each such module must read the media query itself.
      # Scans src/games/*.ts, so it belongs here with the other pre-build source gates and needs no
      # dist/ artifact. It proves PRESENCE, never effectiveness — the per-module unit tests above own
      # that half, and the script's header says which mechanisms and which files it does not see.
      - name: JS-driven motion declares a prefers-reduced-motion guard (gh#77 box7)
        run: node scripts/js-motion-guard-check.mjs --selftest && node scripts/js-motion-guard-check.mjs

      # A meta-gate over the gates themselves. 14 scripts walk the filesystem; only check-citations
      # roots its walk at the repo root, and it excludes .claude/worktrees by relative path. The
      # other 13 are rooted at subdirectories, so a nested checkout is out of reach structurally
      # rather than by an exclusion list. This fires when a FUTURE gate roots at the repo root
      # without that exclusion — the case that would silently grade a second copy of the repo.
      - name: No gate walks from the repo root unguarded (meta-check)
        run: node scripts/repo-root-walk-check.mjs --selftest && node scripts/repo-root-walk-check.mjs

      # gh#120 — the ad-slot reflow's real mechanism. An announced live region whose text a script
      # rewrites must not reserve space with a FLOOR: min-height lets it shrink when the text
      # shortens, and everything below it — including the ad slot — moves. draw and team learned this
      # in prose; wheel and number kept the floor, and it only ever showed on a runner whose Thai
      # font metrics differ from a developer Mac's. This gate makes the rule enforceable.
      - name: A live region above the ad slot reserves a bound, not a floor (gh#120)
        run: node scripts/live-region-height-check.mjs --selftest && node scripts/live-region-height-check.mjs

      # node --test <dir> doesn't work on node 22 (it treats dir as a module path) — must use a glob.
      # A glob that matches NOTHING is not an error: node prints "# tests 0" and exits 0. So a rename
      # (.test.mjs -> .test.ts) or a move out of src/ would leave this step green with every test
      # silently not running — measured, gh#45. The pass count is therefore asserted non-zero:
      # an inverted guard must count, not just exclude (ADR-0019).
      # PIPESTATUS, not $? — after a pipe, $? is tee's status and is always 0 (agent CI-verification doc).
      - name: Unit tests
        run: |
          node --test 'src/**/*.test.mjs' 2>&1 | tee /tmp/unit-tests.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1
          grep -qE '^# pass [1-9]' /tmp/unit-tests.txt \
            || { echo 'Unit tests: 0 tests ran — the glob matched nothing (gh#45)'; exit 1; }

      # astro check writes .astro/ type files, never dist/ — running it here, before Build,
      # makes it structurally impossible for this verification step to invalidate the dist/
      # artifact that every gate below reads. gh#38.
      - name: Astro check
        run: npx astro check

      # npm run build, not npx astro build — the prebuild in package.json must actually run,
      # otherwise the gate that blocks games with no OG image only fires when invoked the other way.
      - name: Build
        run: npm run build

      # gh#86 — the shared page chrome (top bar + footer nav) is opt-in; a game page carrying it
      # would put tap targets above #stage (ADR-0014, ADR-0015). gh#105: the scan once read
      # dist/game/* one level deep and its step name claimed more than the scan (ADR-0019) — it now
      # walks EVERY built .html page, recursively: game pages must never carry the marker, every
      # other page must not unless it is in the check's opt-in set (today: the home page, the #86
      # owner decision), and each opt-in page must keep rendering it. Reads the built artifact, so
      # it sits after Build; --selftest is hermetic (temp fixtures only, never dist/) so it can
      # never regenerate the artifact every step below reads.
      - name: Page chrome confined to the opt-in set (dist artifact)
        run: node scripts/page-chrome-check.mjs --selftest && node scripts/page-chrome-check.mjs

      # Dangling CSS custom-property gate, gh#85: every built page must reference only custom
      # properties something on THAT SAME page defines. Per-page, not a dist/-wide union — CSS is
      # inlined into each HTML (dist/_astro/ ships only .js), so a page referencing a property only
      # another page defines must go red, not pass. Runs after Build because it reads the built
      # artifact; --selftest is hermetic (temp-dir fixtures only, never dist/) so it — like the CSP
      # gates below — never regenerates the artifact this step and every later step reads. gh#38.
      - name: Dangling CSS variable check (dist artifact)
        run: node scripts/dangling-css-var-check.mjs --selftest && node scripts/dangling-css-var-check.mjs

      # CSP checked against dist/staticwebapp.config.json (the deployed artifact), not the
      # repo-root source — Azure SWA only reads config from inside app_location. This also
      # guards the defect where the file silently fails to ship.
      # AdSense's activation snippet is inline JS; script-src has no 'unsafe-inline' by design
      # (our own bundles are external _astro/*.js under 'self'), so when the ad tag is
      # integrated it must live in an external self-hosted script file, not inline.
      # The old version of this step was directive-BLIND: it substring-matched the whole header, so
      # moving *.googlesyndication.com from script-src into img-src kept it green while the AdSense
      # loader was blocked (gh#47, ADR-0019 rule 1). The script asserts (directive, source) pairs.
      # --selftest first, same reason as the gates above — and both CSP selftests are hermetic
      # (temp-dir fixtures and strings only, never dist/), so unlike crawl-check's below they cannot
      # invalidate the artifact this step and every step after it reads. gh#38.
      - name: CSP allowlist check (dist artifact)
        run: node scripts/csp-allowlist-check.mjs --selftest && node scripts/csp-allowlist-check.mjs

      # Inline execution in built HTML, two shapes: an inlined <script> element (Astro inlines a page
      # script with no imports under assetsInlineLimit) and an inline-execution ATTRIBUTE — on*=,
      # javascript: in href/src/formaction, srcdoc=. The attribute half is new: script-src does not
      # govern it at all (script-src-attr / 'unsafe-hashes' does), so it is blocked just as hard and
      # nothing here looked for it (gh#47). Matched as syntactic classes, not member lists.
      # HTML comments are blanked before matching — ADR-0019 rule 2, negative-presence direction.
      # --selftest first, and hermetic: temp fixtures only, dist/ is never rebuilt. gh#38.
      # ⚠ The step NAME is load-bearing: docs/post-launch-checklist.md quotes it verbatim to tell the
      # site owner which gate rejects AdSense's inline activation snippet. Renaming it kills that
      # citation silently — check-citations.mjs only resolves .md targets, so no gate would catch it.
      - name: CSP inline-script gate (dist artifact)
        run: node scripts/csp-inline-check.mjs --selftest && node scripts/csp-inline-check.mjs

      - name: Sitemap covers tool pages
        # Checks all four, not just wheel. The single-page version of this gate stayed green on a
        # sitemap with /tool/draw/ deleted — verified by doctoring dist/sitemap-0.xml, 2026-08-14.
        # SEO is this site's business model, so a tool page silently leaving the sitemap is not cosmetic.
        run: |
          missing=''
          for tool in wheel draw team number; do
            grep -q "/tool/$tool/" dist/sitemap-0.xml || missing="$missing /tool/$tool/"
          done
          if [ -n "$missing" ]; then
            echo "::error::dist/sitemap-0.xml missing:$missing — tool pages must be discoverable"
            exit 1
          fi

      # gh#39 — proves GameNav still renders a crawlable /game/*/ link to every OTHER game on every
      # built game page, and never a self-link. Reads dist/game/*/index.html directly, so it belongs
      # with the other dist-artifact checks above and doesn't need the smoke test's live server below.
      # --selftest is deliberately NOT run here. It mutates tracked source and rebuilds dist/ four
      # times, so the artifact the CSP and sitemap gates above checked would no longer be the one the
      # Smoke test and Deploy below use. Prove the detector by hand instead:
      #   node scripts/crawl-check-gamenav.mjs --selftest
      - name: crawl-check GameNav (dist artifact)
        run: node scripts/crawl-check-gamenav.mjs

      - name: Smoke test (portability — dist/ must serve standalone, no Azure runtime)
        run: npm run smoke-dist

      # gh#122 — the 7 trustworthy browser probes, finally running somewhere. They sit HERE, after
      # Build and after every dist-artifact gate, and deliberately inside this same job rather than a
      # separate one: a separate job would have to rebuild dist/ or ship it as an artifact, and a
      # probe that measures a regenerated dist/ is not measuring the bytes Deploy below uploads.
      # The script never builds; it refuses to start without dist/index.html, refuses ports already
      # in use, and fails loud when no Chrome is present — none of the three can become a skip.
      # Two of the 7 pass on "nothing moved", so the script runs positive controls that must go RED;
      # a probe that silently stopped measuring cannot report a green.
      - name: Browser probes against the deployed artifact (gh#122)
        run: npm run ci-probes

      # Deploy authenticates with Entra ID workload identity federation (OIDC) — this repo stores
      # no deployment token. The federated credential is pinned to the subject
      # repo:warischa/watduang:ref:refs/heads/main, so a run on any other ref cannot authenticate
      # even if the if: below were wrong. Measured 2026-08-26 on throwaway branch wt/ci-108, which
      # relaxed that if: on purpose: runs 32944472000 (v2) and 32944613282 (v3) both failed with
      # AADSTS700213, naming the branch ref as the presented subject. The pin holds.
      #
      # v2 -> v3 is a Node 20 -> 24 runtime bump; GitHub removes Node 20 from runners 2026-09-23.
      # Proved on those same two runs, one variable apart: the failure signature is identical, so the
      # action still loads and mints its OIDC assertion, and the Node 20 deprecation warning present
      # on the v2 run is absent on the v3 one.
      - name: Azure login (OIDC)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DEPLOY_IDENTITY == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Azure/static-web-apps-deploy@v1 accepts no OIDC input and there is no newer major version
      # that does (Azure/static-web-apps#1359, still open), so the token still has to be handed to
      # it the old way. Fetching it here with the OIDC session is a COMMUNITY pattern, not something
      # Microsoft documents. What it buys: the token is fetched fresh every run and never stored, so
      # there is nothing to rotate and deleting the federated credential revokes the whole path.
      # Measured 2026-08-19: Contributor scoped to the SWA resource alone is enough for `secrets
      # list` to return the key — Microsoft documents no required role, so it was tested directly
      # with a temporary client secret that was then deleted and verified gone.
      # App name and resource group are hardcoded in this step on purpose: CLAUDE.md confines
      # everything Azure-specific to this step and staticwebapp.config.json.
      - name: Fetch SWA deployment token
        id: swa_token
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DEPLOY_IDENTITY == 'true' }}
        run: |
          tok=$(az staticwebapp secrets list --name watduang --resource-group rg-watduang \
            --query properties.apiKey -o tsv)
          # Mask first: ::add-mask:: only redacts output that comes after it.
          echo "::add-mask::$tok"
          # az can exit 0 with an empty apiKey (wrong resource, RBAC just revoked). An empty string
          # does not fail the deploy action loudly — it uploads and dies at the far end with an auth
          # error that reads like an Azure outage. Fail here, where the cause is still visible.
          if [ -z "$tok" ]; then
            echo "::error::az staticwebapp secrets list returned an empty apiKey for watduang/rg-watduang — the deploy identity may have lost Contributor on the resource."
            exit 1
          fi
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DEPLOY_IDENTITY == 'true' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          skip_app_build: true

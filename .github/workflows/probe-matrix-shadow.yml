name: probe-matrix-shadow

# SHADOW of ci.yml's browser lane, one lane per runner (owner pick 2026-11-12, "Both, matrix first").
# It gates NOTHING: ci.yml's packed step stays the verdict, and Deploy never waits on this file. It exists
# to measure, on the same SHA as a ci.yml run, two things before any gate moves: the wall clock a matrix
# buys, and whether a lane alone on a runner reads the same rows as the packed run (fit rows, lane1's
# arm-window reads). ci.yml uploads its packed output on ci/* branches for that comparison.
# Runs only on ci/* branch pushes, never on main. scripts/run-workflow-gates.sh reads ci.yml only, so
# nothing here runs on a laptop.
on:
  push:
    branches: ['ci/**']

concurrency:
  group: probe-matrix-shadow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: npm ci
        run: npm ci --no-audit
      - name: Build
        run: npm run build
      - name: Digest the dist/ every lane must probe
        id: digest
        run: |
          d=$(node scripts/probe-scope.mjs --dist-digest dist)
          if ! [[ "$d" =~ ^[0-9a-f]{64}$ ]]; then echo "::error::no dist digest"; exit 1; fi
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "dist digest $d"
      - uses: actions/upload-artifact@v7
        with:
          name: shadow-dist-${{ github.run_attempt }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  lanes:
    needs: dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The split layout (2026-11-12): lane2 and lane4 regrouped, the play-top-band pair reunited, 5 fit shards.
        lane: [exit, overflow, topband, nav, home, firstscreen, fit0, fit1, fit2, fit3, fit4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: npm ci
        run: npm ci --no-audit
      - name: Give the runner a Thai face (gh#287)
        run: |
          log="${{ runner.temp }}/apt-fonts-noto-core.log"
          if ! { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-core; } > "$log" 2>&1; then
            cat "$log"; echo "::error::apt-get could not install fonts-noto-core"; exit 1
          fi
          fc-cache -f
          thai=$(fc-list ':lang=th' family | sort -u)
          printf 'Thai faces on the runner:\n%s\n' "$thai"
          if [ -z "$thai" ]; then echo "::error::fonts-noto-core installed but fc-list finds no Thai face"; exit 1; fi
      - uses: actions/download-artifact@v7
        with:
          name: shadow-dist-${{ github.run_attempt }}
          path: dist
      # The lane probes the bytes the dist job built, or it measures nothing comparable: same digest or red.
      - name: The downloaded dist/ is the one the dist job digested
        run: |
          got=$(node scripts/probe-scope.mjs --dist-digest dist)
          if [ "$got" != "${{ needs.dist.outputs.digest }}" ]; then echo "::error::dist digest $got != ${{ needs.dist.outputs.digest }}"; exit 1; fi
          echo "dist digest matches: $got"
      - name: Run lane ${{ matrix.lane }} alone
        run: |
          t0=$(date +%s)
          PROBE_FIT_SHARDS=5 PROBE_LANES='${{ matrix.lane }}' PROBE_OUT_DIR="${{ runner.temp }}/lane" bash scripts/ci-probes.sh
          echo "LANE_WALL ${{ matrix.lane }} $(( $(date +%s) - t0 ))"
      - name: Keep the lane output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-lane-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lane
            !${{ runner.temp }}/lane/prof-*
          if-no-files-found: warn
          retention-days: 7

  verdict:
    needs: [dist, lanes]
    if: always() && needs.dist.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: npm ci
        run: npm ci --no-audit
      - uses: actions/download-artifact@v7
        with:
          pattern: shadow-lane-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lanes
      # The same three run-level conditions the packed run applies, over every lane's output together.
      - name: Run-level verdict over every lane
        run: |
          dirs=$(ls -d "${{ runner.temp }}"/lanes/*/ | tr '\n' ' ')
          echo "lane outputs: $dirs"
          mkdir -p "${{ runner.temp }}/aggregate"
          PROBE_FIT_SHARDS=5 PROBE_AGGREGATE="$dirs" PROBE_OUT_DIR="${{ runner.temp }}/aggregate" bash scripts/ci-probes.sh

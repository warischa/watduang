<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1a1a1a; }
    a:hover { color: #d6336c; }
  </style>
</helmet>

<div style="width: 390px; min-height: 840px; background: #fffdf7; font-family: 'Noto Sans Thai', Sarabun, system-ui, sans-serif; color: #1a1a1a; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2.5px solid #1a1a1a;">
    <a href="/c/fortune/" style="display: flex; align-items: center; gap: 6px; font-size: 14px; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"></path><path d="M12 19l-7-7 7-7"></path></svg>
      ดูดวงทั้งหมด
    </a>
    <!-- the date is the only thing that makes the word "วันนี้" true on this page. It comes from
         bangkokDate(), the one piece of the old build worth keeping. -->
    <span style="font-size: 13px; font-weight: 500; border: 2px solid #1a1a1a; border-radius: 999px; padding: 3px 10px;">จ. 25 ส.ค.</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 28px 20px; background: {{accent}};">

    <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 220px; background: #fffdf7; border: 2.5px solid #1a1a1a; border-radius: 20px; box-shadow: 5px 5px 0 #1a1a1a;">
      <svg width="150" height="150" viewBox="0 0 150 150" fill="none" aria-hidden="true">
        <circle cx="75" cy="75" r="34" fill="{{accent}}" stroke="#1a1a1a" stroke-width="3"></circle>
        <path d="M75 18 v-12 M75 132 v12 M18 75 h-12 M132 75 h12 M35 35 l-9-9 M115 35 l9-9 M35 115 l-9 9 M115 115 l9 9" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"></path>
        <!-- the wink: this page is a joke and says so in the drawing, not only in the copy -->
        <path d="M64 70 q4 -5 8 0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"></path>
        <circle cx="86" cy="70" r="2.6" fill="#1a1a1a"></circle>
        <path d="M65 85 q10 8 20 0" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"></path>
      </svg>
    </div>

    <span style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 30px; line-height: 1.25; text-align: center;">วันนี้คุณจะเจอ<br>กับอะไร</span>

    <!-- says "ขำๆ" above the fold on purpose. Someone who searched ดวงวันนี้ wanting a real horoscope
         should learn what this page is before they scroll, not after they feel tricked. -->
    <p style="margin: 0; font-size: 15px; line-height: 1.7; text-align: center; max-width: 26ch;">ดวงขำๆ เรื่องจิ๊บจ๊อยประจำวัน ไม่ต้องเชื่อ กดแล้วรู้เลย</p>

    <button style="width: 100%; min-height: 64px; background: #1a1a1a; color: #fffdf7; font-family: Mitr, sans-serif; font-weight: 500; font-size: 22px; border: 2.5px solid #1a1a1a; border-radius: 16px; box-shadow: 5px 5px 0 rgba(26,26,26,0.3); cursor: pointer;">เปิดดวงวันนี้</button>

    <p style="margin: 0; font-size: 13px; line-height: 1.6; text-align: center; max-width: 30ch;">อยากได้คำทำนายจริงจัง ไปเสี่ยงเซียมซี</p>

  </div>

  <div style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-top: 2.5px solid #1a1a1a; background: #f3efe4; font-size: 12px; color: #6b7280;">ช่องโฆษณา — นอกพื้นที่ดูดวง</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd27f","options":["#ffd27f","#f89880","#7fd8e8","#c9a7f0"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ffd27f' };
  }
}
</script>
</body>
</html>

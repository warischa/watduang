<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1a1a1a; }
    a:hover { color: #d6336c; }
  </style>
</helmet>

<div style="width: 390px; min-height: 840px; background: #fffdf7; font-family: 'Noto Sans Thai', Sarabun, system-ui, sans-serif; color: #1a1a1a; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2.5px solid #1a1a1a;">
    <a href="/games/" style="display: flex; align-items: center; gap: 6px; font-size: 14px; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"></path><path d="M12 19l-7-7 7-7"></path></svg>
      ดูเกมทั้งหมด
    </a>
    <span style="font-size: 13px; font-weight: 500; border: 2px solid #1a1a1a; border-radius: 999px; padding: 3px 10px;">คนที่ 2</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 20px 28px 20px; background: {{accent}};">

    <span style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 26px;">คำทำนายวันนี้</span>

    <!-- the fortune card: one long fixed edge, so the type has room to breathe at 16px+ -->
    <div style="display: flex; flex-direction: column; gap: 16px; width: 100%; background: #fffdf7; border: 2.5px solid #1a1a1a; border-radius: 20px; box-shadow: 5px 5px 0 #1a1a1a; padding: 24px 20px; box-sizing: border-box;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2.5"></path><path d="M12 19.5V22"></path><path d="M4.2 4.2l1.8 1.8"></path><path d="M18 18l1.8 1.8"></path><path d="M2 12h2.5"></path><path d="M19.5 12H22"></path><path d="M4.2 19.8L6 18"></path><path d="M18 6l1.8-1.8"></path></svg>
        <span style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 22px;">มายด์</span>
      </div>
      <div style="height: 2.5px; background: #1a1a1a; opacity: 0.15;"></div>
      <p style="margin: 0; font-size: 19px; line-height: 1.75; text-wrap: pretty;">ดวงการงานเด่น มีคนมองเห็นสิ่งที่ทำอยู่เงียบๆ มานาน</p>
    </div>

    <p style="margin: 0; font-family: Mitr, sans-serif; font-weight: 400; font-size: 15px; line-height: 1.6; text-align: center; max-width: 30ch;">อ่านคำทำนายของตัวเองให้วงฟัง</p>

    <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: auto;">
      <button style="width: 100%; min-height: 64px; background: #1a1a1a; color: #fffdf7; font-family: Mitr, sans-serif; font-weight: 500; font-size: 21px; border: 2.5px solid #1a1a1a; border-radius: 16px; box-shadow: 5px 5px 0 rgba(26,26,26,0.3); cursor: pointer;">ดูดวงคนต่อไป</button>
      <div style="display: flex; align-items: center; gap: 8px; background: #fffdf7; border: 2.5px solid #1a1a1a; border-radius: 12px; padding: 10px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span style="font-size: 13px; line-height: 1.5;">กดกี่ครั้งวันนี้ก็ได้ดวงเดิม พรุ่งนี้ค่อยมาดูใหม่</span>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-top: 2.5px solid #1a1a1a; background: #f3efe4; font-size: 12px; color: #6b7280;">ช่องโฆษณา — นอกพื้นที่เล่น</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c9a7f0","options":["#c9a7f0","#ffd27f","#7fd8e8","#f6a5c0"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#c9a7f0' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1a1a1a; }
    a:hover { color: #d6336c; }
  </style>
</helmet>

<div style="width: 390px; min-height: 840px; background: #fffdf7; font-family: 'Noto Sans Thai', Sarabun, system-ui, sans-serif; color: #1a1a1a; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2.5px solid #1a1a1a;">
    <a href="/games/" style="display: flex; align-items: center; gap: 6px; font-size: 14px; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"></path><path d="M12 19l-7-7 7-7"></path></svg>
      ดูเกมทั้งหมด
    </a>
    <span style="font-size: 13px; font-weight: 500; border: 2px solid #1a1a1a; border-radius: 999px; padding: 3px 10px;">เหลือ 4 ไม้</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 24px 20px 28px 20px; background: {{accent}};">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <span style="font-size: 13px;">คนที่ถือมือถือ</span>
      <span style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 30px; line-height: 1.2;">ตาของ เจได</span>
    </div>

    <span style="font-family: Mitr, sans-serif; font-weight: 400; font-size: 16px; text-align: center;">แตะจับไม้ 1 อัน</span>

    <!-- sticks: each is its own 56px+ tap target, gap-spaced so a drag-reorder never collapses them -->
    <div style="display: flex; gap: 10px; align-items: flex-end; justify-content: center; width: 100%; height: 300px; background: #fffdf7; border: 2.5px solid #1a1a1a; border-radius: 20px; box-shadow: 5px 5px 0 #1a1a1a; padding: 20px 14px; box-sizing: border-box;">
      <div style="flex-grow: 1; height: 100%; background: #f7e6c4; border: 2.5px solid #1a1a1a; border-radius: 999px;"></div>
      <div style="flex-grow: 1; height: 100%; background: #f7e6c4; border: 2.5px solid #1a1a1a; border-radius: 999px;"></div>
      <!-- already taken: greyed, still occupies its slot so the row never reflows mid-round -->
      <div style="flex-grow: 1; height: 100%; background: rgba(26,26,26,0.10); border: 2.5px dashed rgba(26,26,26,0.35); border-radius: 999px;"></div>
      <div style="flex-grow: 1; height: 100%; background: #f7e6c4; border: 2.5px solid #1a1a1a; border-radius: 999px;"></div>
      <div style="flex-grow: 1; height: 100%; background: rgba(26,26,26,0.10); border: 2.5px dashed rgba(26,26,26,0.35); border-radius: 999px;"></div>
      <div style="flex-grow: 1; height: 100%; background: #f7e6c4; border: 2.5px solid #1a1a1a; border-radius: 999px;"></div>
    </div>

    <p style="margin: 0; font-size: 13px; line-height: 1.6; text-align: center; max-width: 30ch;">จับปุ๊บรู้ปั๊บ — ใครได้ไม้สั้น คนนั้นโดน จบรอบทันที</p>

    <div style="display: flex; align-items: center; gap: 8px; background: #fffdf7; border: 2.5px solid #1a1a1a; border-radius: 12px; padding: 10px 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
      <span style="font-size: 13px;">ไม้ที่จับไปแล้วจะจางลง แต่ไม่หายไป แถวจะได้ไม่ขยับ</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-top: 2.5px solid #1a1a1a; background: #f3efe4; font-size: 12px; color: #6b7280;">ช่องโฆษณา — นอกพื้นที่เล่น</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#8ce99a","options":["#8ce99a","#7fd8e8","#ffd27f","#c9a7f0"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#8ce99a' };
  }
}
</script>
</body>
</html>

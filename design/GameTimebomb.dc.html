<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1a1a1a; }
    a:hover { color: #d6336c; }
  </style>
</helmet>

<div style="width: 390px; min-height: 840px; background: #fffdf7; font-family: 'Noto Sans Thai', Sarabun, system-ui, sans-serif; color: #1a1a1a; display: flex; flex-direction: column; box-sizing: border-box;">

  <!-- page chrome — the ONLY place a link may live (ADR-0014) -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2.5px solid #1a1a1a; background: #fffdf7;">
    <a href="/games/" style="display: flex; align-items: center; gap: 6px; font-size: 14px; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"></path><path d="M12 19l-7-7 7-7"></path></svg>
      ดูเกมทั้งหมด
    </a>
    <span style="font-size: 13px; font-weight: 500; border: 2px solid #1a1a1a; border-radius: 999px; padding: 3px 10px;">วง 6 คน</span>
  </div>

  <!-- stage — no links inside, ever -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 20px 28px 20px; background: {{accent}};">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <span style="font-size: 13px; letter-spacing: 0.5px;">คนที่ถือมือถือ</span>
      <span style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 30px; line-height: 1.2;">ตอนนี้อยู่ที่ บีม</span>
    </div>

    <!-- the bomb: SVG body + a fuse that shortens as the round runs -->
    <div style="display: flex; align-items: center; justify-content: center; width: 210px; height: 210px; background: #fffdf7; border: 2.5px solid #1a1a1a; border-radius: 50%; box-shadow: 5px 5px 0 #1a1a1a;">
      <svg width="150" height="150" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <circle cx="54" cy="72" r="34" fill="#1a1a1a"></circle>
        <rect x="62" y="30" width="12" height="12" rx="2" fill="#1a1a1a" transform="rotate(20 68 36)"></rect>
        <path d="M72 32 C 84 20, 92 26, 96 16" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-dasharray="46" stroke-dashoffset="17"></path>
        <circle cx="97" cy="15" r="8" fill="{{accent}}" stroke="#1a1a1a" stroke-width="2.5"></circle>
        <circle cx="97" cy="15" r="3.5" fill="#1a1a1a"></circle>
        <ellipse cx="43" cy="60" rx="8" ry="5" fill="#fffdf7" opacity="0.5" transform="rotate(-25 43 60)"></ellipse>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
      <span style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 17px;">ฟิวส์กำลังเดิน</span>
      <!-- fuse bar: the only live progress indicator; length is deliberately NOT a countdown number -->
      <div style="width: 100%; height: 16px; background: #fffdf7; border: 2.5px solid #1a1a1a; border-radius: 999px; overflow: hidden;">
        <div style="width: 62%; height: 100%; background: #1a1a1a;"></div>
      </div>
      <span style="font-size: 12px; color: #4a4a4a;">เสียงติ๊กจะถี่ขึ้นเรื่อยๆ เมื่อใกล้ระเบิด</span>
    </div>

    <button style="width: 100%; min-height: 64px; background: #1a1a1a; color: #fffdf7; font-family: Mitr, sans-serif; font-weight: 500; font-size: 22px; border: 2.5px solid #1a1a1a; border-radius: 16px; box-shadow: 5px 5px 0 rgba(26,26,26,0.3); cursor: pointer;">ส่งต่อ</button>

    <p style="margin: 0; font-size: 13px; line-height: 1.6; text-align: center; max-width: 30ch;">กดปุ่ม "ส่งต่อ" แล้วส่งมือถือให้คนถัดไปทันที ห้ามถือค้างไว้</p>
  </div>

  <!-- ad slot, honestly marked, outside the stage -->
  <div style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-top: 2.5px solid #1a1a1a; background: #f3efe4; font-size: 12px; color: #6b7280;">ช่องโฆษณา — นอกพื้นที่เล่น</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#f89880","options":["#f89880","#ffb703","#7fd8e8","#8ce99a"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#f89880' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1a1a1a; }
    a:hover { color: #d6336c; }
  </style>
</helmet>

<div style="width: 390px; min-height: 840px; background: #fffdf7; font-family: 'Noto Sans Thai', Sarabun, system-ui, sans-serif; color: #1a1a1a; display: flex; flex-direction: column; box-sizing: border-box;">

  <!-- ADR-0040: this page is not a เกม, so the crawlable chrome link goes to the หมวด, not /games/.
       The right-hand roster chip is gone with the roster — nothing replaces it. -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2.5px solid #1a1a1a;">
    <a href="/c/fortune/" style="display: flex; align-items: center; gap: 6px; font-size: 14px; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"></path><path d="M12 19l-7-7 7-7"></path></svg>
      ดูดวงทั้งหมด
    </a>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 20px; background: {{accent}};">

    <span style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 30px; line-height: 1.2;">เซียมซี</span>

    <p style="margin: 0; font-size: 15px; line-height: 1.7; text-align: center; max-width: 26ch;">ตั้งจิตให้นิ่ง แล้วนึกถึงเรื่องที่อยากรู้ให้ชัดในใจ</p>

    <!-- the asked-about area. One chip is selected; the selected one is read back on the slip screen
         so the reader knows which row to read first. "ไม่เจาะจง" is a real answer, not a skip. -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%;">
      <span style="font-size: 13px;">เรื่องที่อยากถาม</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;">
        <span style="font-size: 14px; font-weight: 500; border: 2px solid #1a1a1a; border-radius: 999px; padding: 6px 14px; background: #1a1a1a; color: #fffdf7;">การงาน</span>
        <span style="font-size: 14px; border: 2px solid #1a1a1a; border-radius: 999px; padding: 6px 14px; background: #fffdf7;">ความรัก</span>
        <span style="font-size: 14px; border: 2px solid #1a1a1a; border-radius: 999px; padding: 6px 14px; background: #fffdf7;">การเงิน</span>
        <span style="font-size: 14px; border: 2px solid #1a1a1a; border-radius: 999px; padding: 6px 14px; background: #fffdf7;">สุขภาพ</span>
        <span style="font-size: 14px; border: 2px solid #1a1a1a; border-radius: 999px; padding: 6px 14px; background: #fffdf7;">ไม่เจาะจง</span>
      </div>
    </div>

    <!-- the barrel at rest: upright, lid closed, no stick raised. The same drawing the shake screen
         animates — drawn quiet here on purpose, so the shake screen has somewhere to move from. -->
    <div style="display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 220px; background: #fffdf7; border: 2.5px solid #1a1a1a; border-radius: 20px; box-shadow: 5px 5px 0 #1a1a1a; overflow: hidden;">
      <svg width="200" height="200" viewBox="0 0 200 200" fill="none" aria-hidden="true">
        <rect x="66" y="52" width="9" height="80" rx="4.5" fill="#f7e6c4" stroke="#1a1a1a" stroke-width="2.5"></rect>
        <rect x="84" y="46" width="9" height="86" rx="4.5" fill="#f7e6c4" stroke="#1a1a1a" stroke-width="2.5"></rect>
        <rect x="102" y="50" width="9" height="82" rx="4.5" fill="#f7e6c4" stroke="#1a1a1a" stroke-width="2.5"></rect>
        <rect x="120" y="48" width="9" height="84" rx="4.5" fill="#f7e6c4" stroke="#1a1a1a" stroke-width="2.5"></rect>
        <path d="M56 72 h84 l-9 126 h-66 z" fill="{{accent}}" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"></path>
        <ellipse cx="98" cy="72" rx="42" ry="13" fill="#fffdf7" stroke="#1a1a1a" stroke-width="3"></ellipse>
        <path d="M70 112 h56" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" opacity="0.35"></path>
        <path d="M72 134 h52" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" opacity="0.35"></path>
      </svg>
    </div>

    <button style="width: 100%; min-height: 64px; background: #1a1a1a; color: #fffdf7; font-family: Mitr, sans-serif; font-weight: 500; font-size: 22px; border: 2.5px solid #1a1a1a; border-radius: 16px; box-shadow: 5px 5px 0 rgba(26,26,26,0.3); cursor: pointer;">ตั้งจิตแล้ว</button>

  </div>

  <div style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-top: 2.5px solid #1a1a1a; background: #f3efe4; font-size: 12px; color: #6b7280;">ช่องโฆษณา — นอกพื้นที่เสี่ยง</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd27f","options":["#ffd27f","#f89880","#7fd8e8","#c9a7f0"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ffd27f' };
  }
}
</script>
</body>
</html>

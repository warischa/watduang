<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1a1a1a; }
    a:hover { color: #d6336c; }
  </style>
</helmet>

<div style="width: 390px; min-height: 840px; background: #fffdf7; font-family: 'Noto Sans Thai', Sarabun, system-ui, sans-serif; color: #1a1a1a; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2.5px solid #1a1a1a;">
    <a href="/c/fortune/" style="display: flex; align-items: center; gap: 6px; font-size: 14px; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"></path><path d="M12 19l-7-7 7-7"></path></svg>
      ดูดวงทั้งหมด
    </a>
    <span style="font-size: 13px; font-weight: 500; border: 2px solid #1a1a1a; border-radius: 999px; padding: 3px 10px;">การงาน</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 20px 28px 20px; background: {{accent}};">

    <!-- 15 Thai characters is the ceiling for one line of Mitr 26px inside 390px minus the 20px side
         padding — "ไม้ติ้วหลุดออกมาแล้ว" overflowed the artboard when rendered. -->
    <span style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 26px; line-height: 1.2; text-align: center;">ไม้ติ้วหลุดแล้ว</span>

    <!-- the landing. The barrel has tipped and settled; the stick lies across the ground with its
         marked tip to the left and its number readable. This is the beat the whole shake pays off —
         it gets its own screen so the number is read before any คำทำนาย appears. -->
    <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 260px; background: #fffdf7; border: 2.5px solid #1a1a1a; border-radius: 20px; box-shadow: 5px 5px 0 #1a1a1a; overflow: hidden;">
      <svg width="240" height="240" viewBox="0 0 240 240" fill="none" aria-hidden="true">
        <!-- barrel, leaning back, empty-mouthed -->
        <g style="transform: rotate(-12deg); transform-origin: 150px 180px;">
          <rect x="118" y="66" width="9" height="60" rx="4.5" fill="#f7e6c4" stroke="#1a1a1a" stroke-width="2.5"></rect>
          <rect x="136" y="60" width="9" height="66" rx="4.5" fill="#f7e6c4" stroke="#1a1a1a" stroke-width="2.5"></rect>
          <rect x="154" y="64" width="9" height="62" rx="4.5" fill="#f7e6c4" stroke="#1a1a1a" stroke-width="2.5"></rect>
          <path d="M108 86 h84 l-9 112 h-66 z" fill="{{accent}}" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"></path>
          <ellipse cx="150" cy="86" rx="42" ry="13" fill="#fffdf7" stroke="#1a1a1a" stroke-width="3"></ellipse>
          <path d="M122 124 h56" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" opacity="0.35"></path>
        </g>
        <!-- the fallen stick, number side up. No ground line drawn: nothing else on this site draws a
             floor, and a tilted stick against a straight line always reads as floating above it. -->
        <g style="transform: rotate(-7deg); transform-origin: 100px 196px;">
          <rect x="16" y="182" width="150" height="13" rx="6.5" fill="#f7e6c4" stroke="#1a1a1a" stroke-width="2.5"></rect>
          <rect x="16" y="182" width="24" height="13" rx="6.5" fill="#d6336c" stroke="#1a1a1a" stroke-width="2.5"></rect>
          <text x="118" y="193" font-family="Mitr, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a" text-anchor="middle">๑๔</text>
        </g>
      </svg>
    </div>

    <!-- Thai numerals are what a real ติ้ว carries. Big for the ritual, with the Arabic number under it
         so nobody has to decode it. -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span style="font-family: Mitr, sans-serif; font-weight: 600; font-size: 64px; line-height: 1;">๑๔</span>
      <span style="font-size: 14px;">ไม้ติ้วเบอร์ 14</span>
    </div>

    <button style="width: 100%; min-height: 64px; background: #1a1a1a; color: #fffdf7; font-family: Mitr, sans-serif; font-weight: 500; font-size: 22px; border: 2.5px solid #1a1a1a; border-radius: 16px; box-shadow: 5px 5px 0 rgba(26,26,26,0.3); cursor: pointer;">เปิดใบเซียมซี</button>

  </div>

  <div style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-top: 2.5px solid #1a1a1a; background: #f3efe4; font-size: 12px; color: #6b7280;">ช่องโฆษณา — นอกพื้นที่เสี่ยง</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd27f","options":["#ffd27f","#f89880","#7fd8e8","#c9a7f0"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ffd27f' };
  }
}
</script>
</body>
</html>

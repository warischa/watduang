<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1a1a1a; }
    a:hover { color: #d6336c; }
  </style>
</helmet>

<div style="width: 390px; min-height: 900px; background: #fffdf7; font-family: 'Noto Sans Thai', Sarabun, system-ui, sans-serif; color: #1a1a1a; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2.5px solid #1a1a1a;">
    <a href="/c/fortune/" style="display: flex; align-items: center; gap: 6px; font-size: 14px; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"></path><path d="M12 19l-7-7 7-7"></path></svg>
      ดูดวงทั้งหมด
    </a>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 26px 20px; background: {{accent}};">

    <span style="font-family: Mitr, sans-serif; font-weight: 500; font-size: 30px; line-height: 1.2;">เนื้อคู่ของคุณ</span>

    <p style="margin: 0; font-size: 15px; line-height: 1.7; text-align: center; max-width: 26ch;">บอกดวงหน่อยว่าคุณเป็นใคร แล้วดวงจะบอกว่าเนื้อคู่หน้าตาแบบไหน</p>

    <!-- Everything typed here stays in memory for this one draw: never written to the checkpoint slot,
         never put in the URL, never sent anywhere. There is no server to send it to and there must
         never be one on this path. -->
    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 700;">คุณเป็น</span>
      <div style="display: flex; gap: 8px;">
        <span style="flex: 1; text-align: center; font-size: 15px; font-weight: 500; border: 2.5px solid #1a1a1a; border-radius: 999px; padding: 10px 0; background: #1a1a1a; color: #fffdf7;">ผู้หญิง</span>
        <span style="flex: 1; text-align: center; font-size: 15px; border: 2.5px solid #1a1a1a; border-radius: 999px; padding: 10px 0; background: #fffdf7;">ผู้ชาย</span>
      </div>
    </div>

    <!-- Age as bands, not a number field: no keyboard, no exact birth year, and the band is all the
         draw needs — the meeting age is constrained to sit above the top of whichever band is picked. -->
    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 700;">อายุตอนนี้</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span style="font-size: 14px; border: 2px solid #1a1a1a; border-radius: 999px; padding: 7px 14px; background: #fffdf7;">ต่ำกว่า 20</span>
        <span style="font-size: 14px; border: 2px solid #1a1a1a; border-radius: 999px; padding: 7px 14px; background: #fffdf7;">20-24</span>
        <span style="font-size: 14px; font-weight: 500; border: 2px solid #1a1a1a; border-radius: 999px; padding: 7px 14px; background: #1a1a1a; color: #fffdf7;">25-29</span>
        <span style="font-size: 14px; border: 2px solid #1a1a1a; border-radius: 999px; padding: 7px 14px; background: #fffdf7;">30-34</span>
        <span style="font-size: 14px; border: 2px solid #1a1a1a; border-radius: 999px; padding: 7px 14px; background: #fffdf7;">35-39</span>
        <span style="font-size: 14px; border: 2px solid #1a1a1a; border-radius: 999px; padding: 7px 14px; background: #fffdf7;">40 ขึ้นไป</span>
      </div>
    </div>

    <!-- Pre-selected to the opposite of whatever the first row holds, and freely changeable. Both the
         default and the freedom to change it are the design, not a compromise between them. -->
    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 700;">อยากให้เนื้อคู่เป็น</span>
      <div style="display: flex; gap: 8px;">
        <span style="flex: 1; text-align: center; font-size: 15px; border: 2.5px solid #1a1a1a; border-radius: 999px; padding: 10px 0; background: #fffdf7;">ผู้หญิง</span>
        <span style="flex: 1; text-align: center; font-size: 15px; font-weight: 500; border: 2.5px solid #1a1a1a; border-radius: 999px; padding: 10px 0; background: #1a1a1a; color: #fffdf7;">ผู้ชาย</span>
      </div>
    </div>

    <button style="width: 100%; min-height: 64px; background: #1a1a1a; color: #fffdf7; font-family: Mitr, sans-serif; font-weight: 500; font-size: 22px; border: 2.5px solid #1a1a1a; border-radius: 16px; box-shadow: 5px 5px 0 rgba(26,26,26,0.3); cursor: pointer;">ดูเนื้อคู่</button>

    <p style="margin: 0; font-size: 13px; line-height: 1.6; text-align: center; max-width: 30ch;">ที่กรอกอยู่ในเครื่องคุณเท่านั้น ไม่ได้ส่งไปไหน</p>

  </div>

  <div style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-top: 2.5px solid #1a1a1a; background: #f3efe4; font-size: 12px; color: #6b7280;">ช่องโฆษณา — นอกพื้นที่ดูดวง</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd27f","options":["#ffd27f","#f89880","#7fd8e8","#c9a7f0"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ffd27f' };
  }
}
</script>
</body>
</html>

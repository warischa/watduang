<div id="app">
  <div id="shakeRoot">
    <canvas id="particleCanvas"></canvas>
    
    <!-- Navigation Header -->
    <header>
      <div class="header-left">
        <span class="brand-title">💥 มือลั่น!</span>
      </div>
      <div class="header-right">
        <button id="soundToggleBtn" class="icon-btn" title="เปิด/ปิดเสียง">🔊</button>
        <button id="testRunnerOpenBtn" class="icon-btn" title="รันชุดทดสอบ">🧪 ทดสอบระบบ</button>
        <button id="resetAppBtn" class="icon-btn" title="กลับไปหน้าตั้งค่า">↺ ตั้งค่า</button>
      </div>
    </header>

    <!-- Main Screen Viewport -->
    <main id="mainContent"></main>
  </div>

  <!-- In-Game Interruption Overlay -->
  <div id="interruptionModal" class="modal-overlay" style="display: none;">
    <div class="modal-dialog" style="text-align: center;">
      <div class="badge badge-warning" style="align-self: center;">⚠️ หน้าจอถูกขัดจังหวะ</div>
      <h2 style="font-size: 1.6rem; font-weight: 900;">หลุดการโฟกัสเกม</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem;">
        เบราว์เซอร์ถูกสลับหน้าต่างระหว่างรอบ กรุณาเปิดหน้าจอเกมค้างไว้ระหว่างเล่น!
      </p>
      <button id="resumeTurnBtn" class="btn-primary">🔄 เล่นใหม่อีกครั้ง</button>
    </div>
  </div>

  <!-- Test Runner Modal -->
  <div id="testModal" class="modal-overlay" style="display: none;">
    <div class="modal-dialog">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.3rem; font-weight: 800;">🧪 ชุดทดสอบระบบอัตโนมัติ</h3>
        <button id="closeTestModalBtn" class="icon-btn">✕</button>
      </div>
      <p style="color: var(--text-muted); font-size: 0.85rem;">
        ทดสอบการทำงานของ State Machine, ความแม่นยำของเวลา, การตัดสิทธิ์ False Start, การดวล Sudden Death และกรณี Edge Cases
      </p>
      <div id="testResultsList" class="test-list"></div>
      <button id="executeTestsBtn" class="btn-primary">▶ เริ่มการทดสอบทั้งหมด</button>
    </div>
  </div>
</div>

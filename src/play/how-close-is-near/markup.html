  <!-- Particle FX Canvas Overlay -->
  <canvas id="particlesCanvas"></canvas>

  <!-- App Main Root -->
  <div id="appRoot">
    <!-- Header -->
    <header class="app-header">
      <div class="game-logo" id="logoText">
        <span>🎯</span>
        <span>ไกลแค่ไหนคือใกล้</span>
      </div>
      <div class="header-controls">
        <button id="btnAudioToggle" class="icon-btn" title="เปิด/ปิดเสียง" aria-label="เปิดหรือปิดเสียง">🔊</button>
        <button id="btnTestRunner" class="icon-btn" title="ทดสอบตรรกะเกม (Tests)" aria-label="เปิดชุดทดสอบระบบ">🧪</button>
      </div>
    </header>

    <!-- Round-start announcement channel (gh#170). Ships EMPTY -- a live region with its text baked
         in is a static message, not an announcement -- and main.js writes each turn's intro into it.
         Separate from #rejectionBanner, which is a visible role="alert" for a rejected number. -->
    <p id="hc-live" class="hc-visually-hidden" role="status" aria-live="polite"></p>

    <!-- Dynamic Screen Container -->
    <main id="screenContainer" class="screen-container" role="main"></main>
  </div>

  <!-- Test Runner Modal -->
  <div id="testModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="testModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="testModalTitle">ชุดทดสอบตรรกะเกม (Deterministic Tests)</h3>
        <button id="btnCloseTestModal" class="icon-btn" style="width: 36px; height: 36px;">✕</button>
      </div>
      <div id="testLog" class="test-log-box">กำลังเตรียมการทดสอบ...</div>
      <button id="btnRunTestsNow" class="btn-primary" style="margin-top: 14px;">รันการทดสอบทั้งหมด</button>
    </div>
  </div>

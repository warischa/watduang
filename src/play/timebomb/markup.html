<!-- Full-screen play route for the timebomb game (gh#145, ADR-0050 ruling 1). NOT a lifted mockup: it
     has none, so the shipped engine (src/games/timebomb.ts) is kept and re-dressed to the freeze-tap
     dark reference. This file is the static frame only — the player rows inside #tb-players and every
     game screen inside #tb-stage are built at runtime (main.ts renders the first, the engine's own
     render functions the second, unchanged).
     No <a href> anywhere in here: ADR-0014 keeps navigation out of the play surface, and the one exit
     is <PlayExit />'s button, mounted by play.astro outside this root. -->
<!-- id="app": the same game-root id the other play routes use. Not a cosmetic choice — the shared
     chrome (PlayExit.astro) and the play-route probes both resolve the game root as `#app,
     #app-container`, so a third id would make every one of those checks silently void on this route. -->
<div id="app">
  <!-- id="tb-top": the sound toggle below is armed over this element (ADR-0017), and main.ts needs a
       handle for it. The class stays the styling hook, as everywhere else in this file. -->
  <header class="tb-top" id="tb-top">
    <h1 class="tb-brand">ระเบิดเวลา</h1>
    <!-- gh#165, owner rulings 2026-09-08. The site-wide sound toggle. It is HERE, in the page header,
         and not in #tb-setup or #tb-stage, for three reasons that all have to hold at once:
           * the engine calls replaceChildren() on #tb-stage at every screen change, so a control
             placed there is destroyed by the next render (the same reason the canvas and the reset
             confirm sit outside it);
           * begin() hides #tb-setup one-way, and a mute a player can only reach BEFORE the round
             starts is not the control this ticket is about — the phone is already going round when
             someone wants it quiet;
           * it costs no height. The header is a flex row with min-block-size 56px, and its
             `padding: 8px 56px` already reserves a 56px gutter on the inline-end side purely for
             symmetry with the shared X exit fixed at the top-LEFT. The button is absolutely
             positioned into that reserved gutter, so it is out of flow: it adds nothing to .tb-main's
             column at 320px, which is what scripts/play-screen-fit-probe.mjs measures on this route.
         The state it writes is site-wide (MUTED_KEY in src/shell/audio.ts), and since gh#227 shipped
         in this same batch every other route's toggle reads and writes that same value, so muting
         here is reflected everywhere rather than only obeyed everywhere. See ADR-0064 for why one
         key with many writers is safe where the checkpoint slot was not. -->
    <button id="tb-mute" class="tb-mute" type="button" aria-label="เปิดหรือปิดเสียง">🔊</button>
  </header>

  <main class="tb-main">
    <!-- The player baseline screen (ADR-0054): mascot defaults are already filled in, so the round
         starts with one tap and typing a name is optional. -->
    <section id="tb-setup" class="tb-setup">
      <p class="tb-tagline">ส่งมือถือวนรอบวง ใครถืออยู่ตอนระเบิด คนนั้นแพ้</p>

      <div class="tb-count">
        <button id="tb-count-dec" class="tb-step" type="button" aria-label="ลดจำนวนคนเล่น">−</button>
        <span class="tb-count-read"><span id="tb-count-num">6</span> คน</span>
        <button id="tb-count-inc" class="tb-step" type="button" aria-label="เพิ่มจำนวนคนเล่น">+</button>
      </div>

      <ul id="tb-players" class="tb-players"></ul>

      <p class="tb-hint">แตะที่ชื่อเพื่อเปลี่ยน — ชื่อที่ตั้งไว้ใช้เฉพาะเกมนี้</p>

      <!-- gh#177 — the reset control sits with the rows it acts on, INSIDE #tb-setup, so it is
           unreachable the moment begin() hides this section. Why it is setup-only, and why the copy
           in the dialog below says what it says, is argued in main.ts at the reset handler. -->
      <button id="tb-reset-names" class="tb-secondary-btn" type="button">↺ รีเซ็ตเป็นชื่อสัตว์</button>

      <button id="tb-begin" class="game-btn game-btn-primary" type="button">พร้อมเล่น</button>
    </section>

    <!-- The play surface (owner direction 2026-08-30): the bomb is DRAWN, in Canvas 2D, with the depth
         hand-built (projected ground shadow, radial-gradient sphere, offset highlight). It lives
         OUTSIDE #tb-stage on purpose — the engine calls replaceChildren() on the stage at every screen
         change, which would destroy a canvas placed inside it.
         Canvas pixels are invisible to assistive tech, so this element carries a label and the round's
         live state is announced in the DOM below it: the holder's name is real text and #tb-live
         announces each phase change.
         The label says the fuse is BURNING and not how much of it is left: gh#151 gives a player on a
         screen reader the same uncertainty as everyone else. The label this replaced described the
         cord as shortening with the time remaining — a spoken countdown, and no longer true of what
         the renderer draws. -->
    <canvas
      id="tb-canvas"
      class="tb-canvas"
      role="img"
      aria-label="ระเบิดลูกกลมพร้อมสายชนวนที่จุดไฟติดอยู่"
      hidden></canvas>
    <p id="tb-live" class="tb-visually-hidden" role="status" aria-live="polite"></p>

    <!-- The engine mounts here. It replaces the children of this element wholesale on every screen
         change, so nothing static may live inside it. -->
    <section id="tb-stage" class="tb-stage" hidden></section>

    <!-- The reset confirm (gh#177). Placed OUTSIDE both #tb-setup and #tb-stage, for two different
         reasons: the engine calls replaceChildren() on the stage at every screen change and would
         destroy anything left in it, and a top-layer dialog whose ancestor carries `hidden` is not
         rendered at all — #tb-setup is exactly such an ancestor once begin() has run. Out of flow
         either way: a closed <dialog> is display:none and adds nothing to .tb-main's column.
         No <a href> here, as everywhere in this directory (ADR-0014, ADR-0055). -->
    <dialog class="tb-dialog" id="tb-reset-dialog" aria-labelledby="tb-reset-title">
      <h2 class="tb-dialog-title" id="tb-reset-title">รีเซ็ตเป็นชื่อสัตว์?</h2>
      <p class="tb-dialog-body">ชื่อผู้เล่นที่พิมพ์ไว้จะถูกแทนด้วยชื่อสัตว์ทั้งหมด และเอากลับคืนไม่ได้ จำนวนผู้เล่นที่ตั้งไว้จะยังคงอยู่</p>
      <div class="tb-dialog-actions">
        <button id="tb-reset-cancel" class="tb-secondary-btn" type="button">เก็บชื่อเดิมไว้</button>
        <button id="tb-reset-confirm" class="tb-danger-btn" type="button">รีเซ็ตเป็นชื่อสัตว์</button>
      </div>
    </dialog>
  </main>
</div>
